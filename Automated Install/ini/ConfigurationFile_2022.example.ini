; SQL Server 2022 unattended install template for SqlAutoInstall
;
; Double-brace tokens are filled in by Invoke-SqlBuild when the file is pushed to the target. Passwords are
; never stored here, they are passed to setup.exe on the command line from Vault.
; Install-time baseline settings (MAXDOP, memory, TempDB, IFI) live here, and Test-SqlBuild checks them.
; The legacy ##MyUser## token is still replaced with the service account for older ini files.

[OPTIONS]
ACTION="Install"
IACCEPTSQLSERVERLICENSETERMS="True"
QUIET="True"
UpdateEnabled="False"
ENU="True"
FEATURES=SQLENGINE,REPLICATION,FULLTEXT

INSTANCENAME="{{INSTANCENAME}}"
INSTANCEID="{{INSTANCENAME}}"

; Service accounts, passwords supplied at run time
SQLSVCACCOUNT="{{SQLSVCACCOUNT}}"
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCACCOUNT="{{SQLSVCACCOUNT}}"
AGTSVCSTARTUPTYPE="Automatic"
BROWSERSVCSTARTUPTYPE="Disabled"
SQLSVCINSTANTFILEINIT="True"

SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"
SECURITYMODE="SQL"
SQLSYSADMINACCOUNTS="DOMAINA\DBA_Admins"

; Directories, resolved from volume labels during Preflight
SQLUSERDBDIR="{{SQLUSERDBDIR}}"
SQLUSERDBLOGDIR="{{SQLUSERDBLOGDIR}}"
SQLTEMPDBDIR="{{SQLTEMPDBDIR}}"
SQLTEMPDBLOGDIR="{{SQLTEMPDBLOGDIR}}"

; TempDB
SQLTEMPDBFILECOUNT="8"
SQLTEMPDBFILESIZE="1024"
SQLTEMPDBFILEGROWTH="512"
SQLTEMPDBLOGFILESIZE="1024"
SQLTEMPDBLOGFILEGROWTH="512"

; Instance baseline (2019+ only, SQL 2017 setup does not support these options)
SQLMAXDOP="8"
USESQLRECOMMENDEDMEMORYLIMITS="True"

; Protocols
TCPENABLED="1"
NPENABLED="0"
